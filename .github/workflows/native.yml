name: Native client
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Public source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 tools/validate_public.py
      - name: Scan public source for credentials
        run: |
          curl --fail --silent --show-error --location -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact=100 --no-banner
      - run: python3 tools/generate_xcode.py
      - run: git diff --exit-code -- ios
  native:
    needs: validate
    name: Native ${{ matrix.platform }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, mac]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check generated project
        run: |
          python3 tools/generate_xcode.py
          git diff --exit-code -- ios
      - name: Build shared app and tests
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$NATIVE_PLATFORM" = mac ]; then
            destination='generic/platform=macOS,variant=Mac Catalyst'
          else
            destination='generic/platform=iOS Simulator'
          fi
          xcodebuild -project ios/Sabbo.xcodeproj -scheme Sabbo -configuration Debug \
            -destination "$destination" CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Run shared model and editor tests on Mac
        if: matrix.platform == 'mac'
        run: |
          xcodebuild -project ios/Sabbo.xcodeproj -scheme Sabbo -configuration Debug \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS= PROVISIONING_PROFILE_SPECIFIER= \
            -resultBundlePath /tmp/sabbo-native-results.xcresult \
            -only-testing:SabboTests -only-testing:SabboUITests/ResultFlowTests -only-testing:SabboUITests/BonusFlowTests test
      - name: Run result and bonus flows on iPhone
        if: matrix.platform == 'ios'
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,rows in devices.items() if "iOS" in runtime for d in rows if d["name"].startswith("iPhone")))')
          xcodebuild -project ios/Sabbo.xcodeproj -scheme Sabbo -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            CODE_SIGNING_ALLOWED=NO -resultBundlePath /tmp/sabbo-native-results.xcresult \
            -only-testing:SabboUITests/ResultFlowTests -only-testing:SabboUITests/BonusFlowTests test
      - name: Export native UI evidence
        if: always()
        run: |
          if [ -d /tmp/sabbo-native-results.xcresult ]; then
            xcrun xcresulttool export attachments --path /tmp/sabbo-native-results.xcresult --output-path /tmp/sabbo-ui-evidence
          fi
      - name: Retain native UI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sabbo-native-ui-${{ matrix.platform }}
          path: /tmp/sabbo-ui-evidence
          retention-days: 7
          if-no-files-found: ignore
